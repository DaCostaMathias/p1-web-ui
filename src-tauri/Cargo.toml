[package]
name = "persona-save-studio"
version = "0.1.0"
description = "Browser-only Persona 1 save editor and converter."
edition = "2021"
rust-version = "1.70"

[lib]
name = "persona_save_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
